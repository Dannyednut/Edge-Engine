name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        # No "version" key — the action reads packageManager from package.json
        # (currently pnpm@12.6.0). This avoids ERR_PNPM_BAD_PM_VERSION.
      - run: pnpm install --frozen-lockfile --config.strict-build-check=false
        # pnpm v12 blocks build scripts by default (ERR_PNPM_IGNORED_BUILDS).
        # --config.strict-build-check=false disables the block non-interactively.
        # The allowed packages are also listed in pnpm-workspace.yaml.
      - run: pnpm -r build
        # Build ALL workspace packages so that @edge/types, @edge/alerts,
        # @edge/config, etc. emit dist/ with .d.ts files. Without this,
        # tsc in @edge/scanner cannot resolve @edge/* imports.
        name: Build all workspace packages
      - run: pnpm --filter @edge/scanner typecheck
      - run: pnpm --filter @edge/scanner build
      - run: npx vitest run
