name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        # No "version" key — the action reads packageManager from package.json
        # (currently pnpm@12.6.0). This avoids ERR_PNPM_BAD_PM_VERSION.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @edge/scanner typecheck
      - run: pnpm --filter @edge/scanner build
      - run: npx vitest run
