# Edge-Engine chain config
# Secrets (RPC API keys) are interpolated from environment variables.
# Format: ${VAR_NAME} — substituted at load time by @edge/config.

[ethereum]
rpc_http       = "https://0xrpc.io/eth"
rpc_ws         = "wss://0xrpc.io/eth/ws"
explorer       = "https://etherscan.io"
flashloan_provider = "aave-v3"
native_token   = "ETH"
gas_estimate_usd = 4.50

[arbitrum]
rpc_http       = "https://arb1.arbitrum.io/rpc"
rpc_ws         = "wss://arb1.arbitrum.io/ws"
explorer       = "https://arbiscan.io"
flashloan_provider = "aave-v3"
native_token   = "ETH"
gas_estimate_usd = 0.10

[base]
rpc_http       = "https://mainnet.base.org"
rpc_ws         = "wss://mainnet.base.org/wss"
explorer       = "https://basescan.org"
flashloan_provider = "aave-v3"
native_token   = "ETH"
gas_estimate_usd = 0.08

[optimism]
rpc_http       = "https://mainnet.optimism.io"
rpc_ws         = "wss://mainnet.optimism.io/ws"
explorer       = "https://optimistic.etherscan.io"
flashloan_provider = "aave-v3"
native_token   = "ETH"
gas_estimate_usd = 0.05

[polygon]
