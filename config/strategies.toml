# Strategy parameters loaded by packages/config/src/index.ts and consumed by
# packages/scanner/src/runners/strategy-configs.ts.
# 32 TOML sections: 30 configured runner strategies plus 2 reserved placeholders.
# Config consumption does not imply economic validation or execution readiness.
# Some configured scanners are monitoring-only or research-only.

# ═══ ORIGINAL STRATEGIES (Briefs 01-03) ═══

[perp_funding]
min_spread_apr    = 0.08
max_position_usd  = 4000
max_concurrent    = 2
cooldown_ms       = 60000
gas_price_cap_mult = 3.0
long_venues       = ["pacifica", "paradex"]
short_venues      = ["hyperliquid", "dydx"]
use_vooi_executor = true

[cex_hl_funding_arb]
min_spread_apr    = 0.05
max_position_usd  = 5000
max_concurrent    = 2
cooldown_ms       = 60000

[dex_cex_flashloan]
# min_edge_bps: gross spread threshold (30 bps = 0.3%)
# max_position_usd: flashloan-funded position size
# flashloan_provider: informational — the use_balancer/use_aave_fallback
#   booleans below drive actual provider selection.
# use_balancer: use Balancer V2 as primary flashloan (0% fee)
# use_aave_fallback: fall back to Aave V3 if Balancer not on chain (0.05% fee)
# use_flashbots: MEV protection (not yet wired — tracked in docs/CONFIG_AUDIT.md)
min_edge_bps      = 30
max_position_usd  = 5000
max_concurrent    = 3
cooldown_ms       = 30000
flashloan_provider = "aave-v3"
chains_active     = ["arbitrum", "base"]
use_balancer      = true
use_aave_fallback = true

[prediction_arb]
min_divergence_pct = 3.0
max_position_usd  = 2000
max_concurrent    = 2
capital_lock_days_max = 30

[sports_arb]
min_edge_pct      = 1.0
max_position_usd  = 500
max_concurrent    = 5

[mev_backrun]
min_profit_usd    = 1
max_position_usd  = 50
max_concurrent    = 5
chains_active     = ["solana", "arbitrum", "bsc"]
use_jito_bundles  = true
use_flashbots     = true

[hl_spot_basis]
min_basis_bps     = 20
max_position_usd  = 5000
max_concurrent    = 2
cooldown_ms       = 60000

[hlp_yield]
min_entry_apr_pct = 15
warning_apr_pct   = -5
timeframe         = "week"

[pendle_boros]
# min_spread_apr_pct: min APR spread between fixed and floating yield (5 = 5% APR)
#   (renamed from min_yield_pct for clarity — see docs/CONFIG_AUDIT.md)
min_spread_apr_pct = 5
max_position_usd  = 10000
max_concurrent    = 3

[pt_yield_arb]
min_spread_pct    = 1.0
max_position_usd  = 10000
max_concurrent    = 3

[pt_khype_yield_arb]
min_spread_pct    = 1.0
max_position_usd  = 5000
max_concurrent    = 2

[lst_yield_comparison]
# min_yield_pct: min yield spread between LSTs (3.0 = 3%)
# min_tvl_usd: min TVL for a market to be considered ($1M default)
# max_position_usd: parsed but NOT consumed — LstYieldComparisonScanner
#   has no maxSizeUsd param; riskParams hardcodes 10_000.
min_yield_pct     = 3.0
min_tvl_usd       = 1000000
max_position_usd  = 10000
max_concurrent    = 3

[euler_lending_arb]
min_spread_pct    = 2.0
max_position_usd  = 10000
max_concurrent    = 3

[tokenized_equity]
min_spread_pct    = 2.0
max_position_usd  = 5000
max_concurrent    = 2

[equity_perp_cross_venue]
min_spread_pct    = 2.0
max_position_usd  = 5000
max_concurrent    = 2

[hl_amm_arb]
min_edge_bps      = 20
max_position_usd  = 5000
max_concurrent    = 2

[hl_lst_arb]
min_spread_pct    = 1.0
max_position_usd  = 5000
max_concurrent    = 2

[gold_arb]
min_spread_pct    = 0.5
max_position_usd  = 10000
max_concurrent    = 2

[cross_dex_arb]
# Gross public-reference divergence screen only; NOT a net-profit threshold.
# Prices/reserves are discovery data; fee, slippage, gas and route simulation are not included.
min_gross_spread_bps = 15
min_reserve_usd   = 50000
max_position_usd  = 8000
max_concurrent    = 3

[precompile_flashloan_arb]
min_edge_bps      = 20
max_position_usd  = 10000
max_concurrent    = 2
chains_active     = ["hyperevm"]

[cexlike_dex_price_arb]
min_edge_bps      = 25
max_position_usd  = 5000
max_concurrent    = 2

[solana_memecoin_arb]
# min_edge_bps: min cross-AMM spread (80 bps = 0.8%).
#   Break-even is 50 bps (0.25% × 2 legs PumpApi fee). 80 bps gives
#   a 0.3% profit margin above fees. DO NOT set below 50 or arbs fire
#   at a guaranteed loss.
min_edge_bps      = 80
max_position_usd  = 500
max_concurrent    = 3

