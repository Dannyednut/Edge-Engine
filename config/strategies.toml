# Strategy parameters — adjustable at runtime via re-deploy.

[perp_funding]
min_spread_apr    = 0.08      # 8% APR minimum to fire
max_position_usd  = 4000      # 40% of $10k working cap
max_concurrent    = 2
cooldown_ms       = 60000
gas_price_cap_mult = 3.0
long_venues       = ["pacifica", "paradex"]
short_venues      = ["hyperliquid", "dydx"]
use_vooi_executor = true      # use VOOI atomic paired-leg execution

[dex_cex]
min_edge_bps      = 30        # 30 bps minimum
max_position_usd  = 5000      # use flashloans to lever up beyond working cap
max_concurrent    = 3
cooldown_ms       = 30000
gas_price_cap_mult = 3.0
use_flashloan     = true
flashloan_provider = "aave-v3"
chains_active     = ["arbitrum", "base"]
use_flashbots     = true

[dex_dex]
min_edge_bps      = 15
max_position_usd  = 8000      # flashloan-powered
max_concurrent    = 3
cooldown_ms       = 30000
chains_active     = ["arbitrum", "base", "solana"]
use_flashloan     = true

[prediction_arb]
min_divergence_pct = 3.0
max_position_usd  = 2000
max_concurrent    = 2
capital_lock_days_max = 30
platforms         = ["polymarket", "azuro", "overtime", "zeitgeist", "manifold"]

[sports_arb]
min_edge_pct      = 1.0
max_position_usd  = 500
max_concurrent    = 5
sharp_books       = ["pinnacle", "circa"]
soft_books        = ["draftkings", "fanduel", "betmgm", "betus"]

[mev_backrun]
min_profit_usd    = 1
max_position_usd  = 50
max_concurrent    = 5
chains_active     = ["solana", "arbitrum", "bsc"]
use_jito_bundles  = true
use_flashbots     = true
