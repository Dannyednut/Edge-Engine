packages:
  - 'packages/*'
  - 'contracts'

# pnpm v12 blocks build scripts by default. These 3 packages need
# postinstall/build scripts to function. Listed here so pnpm allows
# their builds without interactive approval.
onlyBuiltDependencies:
  - bufferutil
  - ccxt
  - esbuild

# Fallback: if onlyBuiltDependencies is still ignored (pnpm version
# differences), allow all builds in CI. This is less secure but
# necessary for non-interactive CI install.
dangerouslyAllowAllBuilds: true
